<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso - Happy Paws Vet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#817668;
            min-height:100vh;
        }
    </style>
<style>
.card{

    background: rgba(255,255,255,0.18);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    border: 1px solid rgba(172, 163, 163, 0.25);

    border-radius:20px;

    box-shadow:0 15px 35px rgba(0,0,0,.15);

}
body{
    margin:0;
    min-height:100vh;
    background:#8F8578; /* tu color de fondo */
}

.login-container{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    border-radius:20px;
}
@media (max-width:768px){

    .card{

        max-width:100%;

        margin:0 10px;

    }

    .card-body{

        padding:25px;

    }

    h4{

        font-size:26px;

    }

    .btn{

        padding:12px;

        font-size:17px;

    }

}
</style>
</head>
<body>
  
<div class="container login-container">
    <div class="card shadow-sm mx-auto" style="max-width: 400px;">
        <div class="card-body">
            <h4 class="text-center mb-4">Acceso al sistema 🐾</h4>

			<form method="POST">
			    <div class="mb-3">
			        <label for="email" class="form-label">Correo</label>
			        <input type="email" class="form-control" name="email" required>
			    </div>
			    <div class="mb-3">
			        <label for="password" class="form-label">Contraseña</label>
			        <input type="password" class="form-control" name="password" required>
			    </div>
                 {% with mensajes = get_flashed_messages(with_categories=true) %}

    {% if mensajes %}

        {% for categoria, mensaje in mensajes %}

            <div class="mensaje-error">
                {{ mensaje }}
            </div>

        {% endfor %}

    {% endif %}

{% endwith %}
			    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
			</form>
			<div class="text-center mt-3">
			    <small>¿No tienes una cuenta? <a href="{{ url_for('registro') }}">Regístrate</a></small>
			</div>

			<div class="text-center mt-3">
			    <small><a href="{{ url_for('inicio') }}">Volver</a></small>
			</div>


        </div>
    </div>
</div>
</body>
</html>
