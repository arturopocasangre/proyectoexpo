<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>🐾 Happy Paws Vet - Consulta Virtual</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://meet.happypawsvet.shop/external_api.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>    
        html, body {
            overflow-x: hidden;
            touch-action: none; /* bloquea gestos táctiles como swipe atrás */
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overscroll-behavior-y: contain; /* evita que el gesto de arrastre refresque */
        }
        header, footer {
            flex-shrink: 0;
        }
        #jitsi-container {
            flex-grow: 1;
            width: 100%;
        }
        /* Botón flotante para móviles */
        #hangup-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }
        @media (min-width: 769px) {
            #hangup-btn {
                display: none; /* ocultar en escritorio */
            }
        }
    </style>
</head>
<body class="bg-light">

    <!-- Encabezado corporativo -->
    <header class="bg-dark text-white text-center p-2">
        <h4>🐾 Happy Paws Vet 🐾</h4>
    </header>

    <!-- Contenedor Jitsi -->
    <div id="jitsi-container"></div>

    <!-- Footer corporativo -->
    <footer class="bg-dark text-white text-center p-2">
        <small>&copy; 2026 Happy Paws Vet - Todos los derechos reservados</small><br>
        <small>Contacto: soporte@happypawsvet.com</small>
    </footer>

    <!-- Botón flotante solo en móviles (Descomentar si deseas usarlo) -->
    <!-- <button id="hangup-btn" class="btn btn-danger">Colgar</button> -->

<script>
    const domain = "meet.happypawsvet.shop";
    const options = {
        roomName: "{{ room_name }}",
        parentNode: document.querySelector('#jitsi-container'),
        userInfo: { displayName: "Cliente Happy Paws" },
        configOverwrite: {
            prejoinPageEnabled: false,
            startWithAudioMuted: false,
            startWithVideoMuted: false
        }
    };

    const api = new JitsiMeetExternalAPI(domain, options);

    // Función reutilizable para limpiar la llamada y redirigir
    const finalizarYRedirigir = () => {
        api.dispose(); // Libera la cámara, micrófono e iframe
        window.location.href = "{{ url_for('panel_cliente') }}";
    };

    // 1. Evento cuando la sala emite el evento de cierre
    api.addEventListener("readyToClose", finalizarYRedirigir);

    // 2. Evento cuando el usuario abandona la videoconferencia (útil tras auth/cancelaciones)
    api.addEventListener("videoConferenceLeft", finalizarYRedirigir);

    // 3. Botón flotante para colgar manualmente (evalúa si existe antes de asignar)
    const hangupBtn = document.getElementById("hangup-btn");
    if (hangupBtn) {
        hangupBtn.addEventListener("click", () => {
            api.executeCommand("hangup");
            finalizarYRedirigir();
        });
    }
</script>

<script>
    // Empuja un estado vacío al historial para evitar que regresen con el botón 'Atrás'
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
        history.go(1); // fuerza a quedarse en la misma página
    };
</script>

</body>
</html>
